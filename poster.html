<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meditek Poster</title>
<meta name="theme-color" content="#106b57">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Roboto+Condensed:wght@500;700&family=Noto+Sans+Tamil:wght@700;800&display=swap">
<style>
  :root { --g: #106b57; --bg: #eef3f1; --fg: #13201c; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, "Noto Sans Tamil", sans-serif;
    padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 18px; color: var(--g); }
  #img { width: 100%; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.15); background: #fff; min-height: 200px; }
  .btn { display: block; width: 100%; padding: 16px; border-radius: 14px; border: 0; font-size: 18px; font-weight: 800; text-align: center; text-decoration: none; cursor: pointer; }
  .wa { background: #1faa53; color: #fff; }
  .dl { background: #fff; color: var(--g); border: 2px solid var(--g); }
  .note { font-size: 14px; line-height: 1.6; background: #fff; border-radius: 12px; padding: 12px 14px; }
  .note b { color: var(--g); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl">போஸ்டர் தயாராகிறது…</h1>
  <img id="img" alt="போஸ்டர்">
  <button id="share" class="btn wa" hidden>📤 WhatsApp-ல் போஸ்டர் அனுப்பு</button>
  <a id="dl" class="btn dl" hidden download="meditek-poster.jpg">⬇ போஸ்டரைச் சேமி</a>
  <div class="note"><b>எப்படி அனுப்புவது:</b> மேலே உள்ள பச்சைப் பட்டனைத் தட்டி <b>WhatsApp</b> தேர்வு செய்யவும். இப்போதுதான் செய்தி அனுப்பிய அந்தக் கடையின் chat <b>மேலே முதலில்</b> இருக்கும் — அதைத் தேர்வு செய்து <b>Send</b>.</div>
</div>
<canvas id="cv" width="1264" height="1264" hidden></canvas>
<script>
const P = new URLSearchParams(location.search);
const NAME = (P.get('n') || 'Medical').trim(), TOWN = (P.get('t') || '').trim(), DAY = (P.get('d') || '').trim();
// one spelling of the town everywhere: a word in the address that is the same town spelt differently (Thiruvengadam / Thiruvenkadam) takes the heading's spelling
const townKey = t => String(t || '').toLowerCase().replace(/[^a-z]/g, '').replace(/h/g, '').replace(/[aeiouy]/g, '').replace(/g/g, 'k').replace(/d/g, 't').replace(/b/g, 'p').replace(/w/g, 'v').replace(/(.)\1+/g, '$1');
const ADDR = (P.get('a') || '').trim().replace(/[A-Za-z]+/g, w => TOWN && w.length > 3 && townKey(w) === townKey(TOWN) ? TOWN : w);
const CAT = ['pharmacy', 'clinic', 'hospital', 'dental', 'vet'].includes(P.get('c')) ? P.get('c') : 'pharmacy';
const UP = NAME.toUpperCase(), O = 'Oswald, "Arial Narrow", sans-serif', R = '"Roboto Condensed", "Arial Narrow", sans-serif';
// regions [x, y, w, h, text, weight, maxPx, family, color, align]
const N = '#0b2a5b', TEAL = '#1f8a9a';
const SPEC = {
  clinic: [[40, 14, 1184, 158, UP, 700, 140, O, N], [470, 166, 324, 56, TOWN, 700, 46, R, TEAL], [836, 296, 282, 66, DAY, 700, 54, R, '#111'],
           [86, 646, 368, 34, UP, 700, 28, R, N], [86, 684, 380, 24, ADDR, 500, 17, R, '#222', 'l']],
  hospital: [[30, 18, 900, 128, UP, 700, 112, O, N], [372, 146, 182, 42, TOWN, 700, 34, R, TEAL], [950, 152, 266, 74, DAY, 700, 56, R, '#111'],
           [116, 578, 388, 34, UP, 700, 26, R, N], [116, 614, 396, 26, ADDR, 500, 18, R, '#222', 'l']],
  dental: [[40, 12, 1184, 112, UP, 700, 100, O, N], [536, 126, 190, 44, TOWN, 700, 36, R, TEAL], [908, 244, 238, 60, DAY, 700, 46, R, '#111'],
           [108, 610, 340, 30, UP, 700, 22, R, N], [108, 644, 392, 24, ADDR, 500, 16, R, '#222', 'l']],
  vet: [[40, 8, 1184, 144, UP, 700, 128, O, N], [536, 154, 200, 48, TOWN, 700, 38, R, TEAL], [924, 254, 268, 64, DAY, 700, 50, R, '#111'],
           [126, 658, 392, 38, UP, 700, 26, R, N], [126, 700, 400, 22, ADDR, 500, 16, R, '#222', 'l']],
  pharmacy: [[60, 12, 1144, 96, UP, 700, 86, O, N], [516, 106, 232, 58, TOWN, 700, 42, R, TEAL], [808, 238, 340, 86, DAY, 700, 68, R, '#111'],
           [90, 536, 344, 62, UP, 700, 38, O, N], [90, 604, 370, 28, ADDR, 500, 20, R, '#222', 'l'],
           [492, 606, 480, 52, "We'd love to serve you!", 700, 34, R, '#fff'],
]
};
// storefront signboard (the template photo's board is blank): [x0, y0, x1, y1, face colour, side colour, 2nd-line colour]
const SIGN = {
  clinic:   [176, 236, 512, 362, '#0b2a5b', '#061a3a', '#0f7a4f'],
  pharmacy: [52, 190, 556, 256, '#0b2a5b', '#061a3a', ''],
  hospital: [250, 240, 640, 335, '#0b2a5b', '#061a3a', '#0f7a4f'],
  dental:   [240, 190, 616, 302, '#0b2a5b', '#061a3a', '#1f8a9a'],
  vet:      [142, 226, 540, 316, '#0e6b47', '#07402a', '#0e6b47']
};
/* letters made like a real shop board: raised acrylic letters with depth, a soft shadow on the board,
   a light-from-above face, the board's own lighting over them, and the photo's grain and softness */
function sign(ctx) {
  const [x0, y0, x1, y1, face, side, c2] = SIGN[CAT], w = x1 - x0, h = y1 - y0, two = !!(c2 && TOWN);
  const L = document.createElement('canvas'); L.width = w; L.height = h; const g = L.getContext('2d');
  const fit = (t, fam, wt, maxH, maxW) => { let s = maxH; g.font = wt + ' ' + s + 'px ' + fam; while (g.measureText(t).width > maxW && s > 10) { s--; g.font = wt + ' ' + s + 'px ' + fam; } return s; };
  const raised = (t, cy, s, fam, wt, col, dk) => {
    g.font = wt + ' ' + s + 'px ' + fam; g.textAlign = 'center'; g.textBaseline = 'middle';
    const d = Math.max(2, Math.round(s / 16)), cx = w / 2;
    g.save(); g.shadowColor = 'rgba(0,0,0,.38)'; g.shadowBlur = s / 7; g.shadowOffsetX = d * 1.2; g.shadowOffsetY = d * 1.9; g.fillStyle = dk; g.fillText(t, cx + d, cy + d); g.restore();
    for (let i = d; i > 0; i--) { g.fillStyle = dk; g.fillText(t, cx + i * 0.8, cy + i * 0.9); }
    g.globalAlpha = .55; g.fillStyle = '#fff'; g.fillText(t, cx - 0.8, cy - 0.8); g.globalAlpha = 1;
    const gr = g.createLinearGradient(0, cy - s / 2, 0, cy + s / 2); gr.addColorStop(0, col); gr.addColorStop(1, dk); 
    g.fillStyle = col; g.fillText(t, cx, cy); g.globalAlpha = .35; g.fillStyle = gr; g.fillText(t, cx, cy); g.globalAlpha = 1;
  };
  const padX = w * 0.04, s1 = fit(UP, O, 700, two ? h * 0.52 : h * 0.72, w - 2 * padX);
  if (two) { const s2 = fit(TOWN, R, 700, h * 0.24, w * 0.7); raised(UP, h * 0.37, s1, O, 700, face, side); raised(TOWN, h * 0.79, s2, R, 700, c2, side); }
  else raised(UP, h * 0.52, s1, O, 700, face, side);
  // the board's lighting falls on the letters too (brighter at the top, a little darker at the bottom)
  g.globalCompositeOperation = 'source-atop';
  const lt = g.createLinearGradient(0, 0, 0, h); lt.addColorStop(0, 'rgba(255,255,255,.10)'); lt.addColorStop(1, 'rgba(0,0,0,.12)'); g.fillStyle = lt; g.fillRect(0, 0, w, h);
  // the photo's grain
  const id = g.getImageData(0, 0, w, h), p = id.data; for (let i = 0; i < p.length; i += 4) if (p[i + 3]) { const n = (Math.random() - .5) * 14; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
  g.putImageData(id, 0, 0); g.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.filter = 'blur(0.45px)'; ctx.drawImage(L, x0, y0); ctx.restore();
}
// Tamil promise panel: replaces the template's chip row (it repeated the product tiles) — [x0, y0, x1, y1]
const PANEL = { clinic: [34, 734, 1230, 848], pharmacy: [34, 660, 1230, 782], hospital: [34, 664, 1230, 789], dental: [20, 696, 1244, 818], vet: [20, 744, 1244, 848] };
// sticky note: the small handwriting becomes a bold, readable Tamil note — [centre x, centre y, width, height, tilt°, note colour]
const NOTE = { clinic: [782, 492, 182, 208, -9, '#fded9e'], pharmacy: [802, 460, 212, 212, -5.5, '#fbef79'], hospital: [843, 335, 189, 196, -3.7, '#fbf18f'],
               dental: [785, 417, 212, 212, -5.8, '#fdf394'], vet: [792, 471, 201, 278, -3, '#fde774', 0.07] };
const TA = "'Noto Sans Tamil', 'Latha', sans-serif";
const WD_TA = { Monday: 'திங்கள்கிழமை', Tuesday: 'செவ்வாய்க்கிழமை', Wednesday: 'புதன்கிழமை', Thursday: 'வியாழக்கிழமை', Friday: 'வெள்ளிக்கிழமை', Saturday: 'சனிக்கிழமை' };
function fitFont(ctx, t, fam, wt, maxPx, maxW) { let z = maxPx; ctx.font = wt + ' ' + z + 'px ' + fam; while (ctx.measureText(t).width > maxW && z > 10) { z--; ctx.font = wt + ' ' + z + 'px ' + fam; } return z; }
function panel(ctx) {
  const [x0, y0, x1, y1] = PANEL[CAT], w = x1 - x0, h = y1 - y0, cx = x0 + w / 2;
  ctx.fillStyle = '#fefefe'; ctx.fillRect(x0, y0, w, h);   // the template's panel is plain white
  const day = WD_TA[DAY], l1 = day ? 'ஒவ்வொரு ' + day + 'யும் உங்கள் பகுதிக்கு வருகிறோம்' : 'வாரந்தோறும் உங்கள் பகுதிக்கு வருகிறோம்';
  const l2 = 'தேவையான பொருட்களை WhatsApp-இல் ஆர்டர் செய்யுங்கள் · சரியான நேரத்தில் டெலிவரி';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fitFont(ctx, l1, TA, 800, h * 0.36, w * 0.92); ctx.fillStyle = N; ctx.fillText(l1, cx, y0 + h * 0.36);
  fitFont(ctx, l2, TA, 700, h * 0.22, w * 0.92); ctx.fillStyle = TEAL; ctx.fillText(l2, cx, y0 + h * 0.76);
}
function note(ctx) {
  const [cx, cy, w, h, deg, col, tp = 0.14] = NOTE[CAT], iw = w * 0.94, ih = h * (0.96 - tp), oy = h * (tp - 0.04) / 2;   // tp: top part kept for the pin
  ctx.save(); ctx.translate(cx, cy + oy); ctx.rotate(deg * Math.PI / 180);
  ctx.fillStyle = col; ctx.filter = 'blur(5px)'; ctx.fillRect(-iw / 2, -ih / 2, iw, ih); ctx.filter = 'none';   // clear the old handwriting with soft edges (the pin at the top stays)
  ctx.fillRect(-iw / 2 + 6, -ih / 2 + 6, iw - 12, ih - 12);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#0b2a5b';
  const a = 'சிறந்த விலை!', b = 'உங்கள் தேவையை', c = 'சொல்லுங்கள்';
  fitFont(ctx, a, TA, 800, ih * 0.3, iw * 0.94); ctx.fillStyle = '#c62828'; ctx.fillText(a, 0, -ih * 0.22);
  ctx.fillStyle = '#0b2a5b'; const z = Math.min(fitFont(ctx, b, TA, 700, ih * 0.21, iw * 0.94), fitFont(ctx, c, TA, 700, ih * 0.21, iw * 0.94));
  ctx.font = '700 ' + z + 'px ' + TA; ctx.fillText(b, 0, ih * 0.1); ctx.fillText(c, 0, ih * 0.33);
  ctx.restore();
}
function bgOf(ctx, x, y, w, h) {             // average colour of the region's border ring
  const px = [], add = d => { for (let i = 0; i < d.length; i += 4) px.push([d[i], d[i + 1], d[i + 2]]); };
  add(ctx.getImageData(x, y, w, 2).data); add(ctx.getImageData(x, y + h - 2, w, 2).data);
  add(ctx.getImageData(x, y, 2, h).data); add(ctx.getImageData(x + w - 2, y, 2, h).data);
  const m = [0, 1, 2].map(k => px.map(p => p[k]).sort((a, b) => a - b)[px.length >> 1]);
  return 'rgb(' + m.join(',') + ')';
}
function draw(img) {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, 1264, 1264);
  sign(ctx); panel(ctx); note(ctx);
  const regs = SPEC[CAT], bgs = regs.map(r => bgOf(ctx, r[0], r[1], r[2], r[3]));
  regs.forEach((r, i) => {
    const [x, y, w, h, t, wt, max, fam, col, al, fill] = r; ctx.fillStyle = fill || bgs[i]; ctx.fillRect(x, y, w, h);
    if (!t) return;
    let sz = max; ctx.font = wt + ' ' + sz + 'px ' + fam;
    while (ctx.measureText(t).width > w - 16 && sz > 10) { sz--; ctx.font = wt + ' ' + sz + 'px ' + fam; }
    ctx.fillStyle = col; ctx.textBaseline = 'middle'; ctx.textAlign = al === 'l' ? 'left' : 'center';
    ctx.fillText(t, al === 'l' ? x + 6 : x + w / 2, y + h / 2 + 1);
  });
  cv.toBlob(b => {
    const url = URL.createObjectURL(b), file = new File([b], 'Meditek-' + NAME.replace(/[^\w]+/g, '-') + '.jpg', { type: 'image/jpeg' });
    document.getElementById('img').src = url; const dl = document.getElementById('dl'); dl.href = url; dl.download = file.name; dl.hidden = false;
    document.getElementById('ttl').textContent = NAME + (TOWN ? ' · ' + TOWN : '');
    const sh = document.getElementById('share');
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      sh.hidden = false; sh.onclick = () => navigator.share({ files: [file] }).catch(() => {});
    }
  }, 'image/jpeg', 0.9);
}
(document.fonts && document.fonts.load ? Promise.all([document.fonts.load('700 40px Oswald'), document.fonts.load('700 30px "Roboto Condensed"'), document.fonts.load('500 20px "Roboto Condensed"'), document.fonts.load("800 30px 'Noto Sans Tamil'"), document.fonts.load("700 30px 'Noto Sans Tamil'")]) : Promise.resolve())
  .catch(() => {}).then(() => { const im = new Image(); im.onload = () => draw(im); im.src = 'tpl/' + CAT + '.jpg?v=2'; });
</script>
</body>
</html>
